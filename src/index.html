<!DOCTYPE html>
<html lang="en">
<head>

<script>
/* ============================================================
   DATA SOURCE CONFIG
   To pull LIVE from your Google Sheet:
     1. In the sheet: Share ▸ General access ▸ "Anyone with the link" ▸ Viewer.
     2. Copy the sheet ID from its URL (the part between /d/ and /edit).
     3. Paste it below as sheetId. Save. Done — edits in the sheet now
        appear on refresh, no re-upload. Tab names must match TABS.
   Leave sheetId empty to use the baked snapshot in data.js.
   ============================================================ */
const CONFIG = {
  sheetId: '1l58RfG7rVHjYX96k3hX8FI7xSF9BB3MMhs9sTi9HO0A',
  tabs: { States:'States', rates:'Annual Rate Increase Requests', puc:'PUC Info',
          commissioners:'Commissioners', capex:'CapEx', bills:'Utility Bills',
          dockets:'Dockets', capexTotals:'CapEx Total By State', benchmarks:'Benchmarks',
          glossary:'Glossary' }
};
/* Tabs that may be absent without breaking the live load (fall back gracefully). */
const OPTIONAL = { capexTotals:1, benchmarks:1, glossary:1 };

/* ------------------------------------------------------------
   GLOSSARY / "?" EXPLAINERS  —  sheet tab "Glossary"
   Row 1 = headers. Col A = Key, Col B = Term, Col C = Explainer.
   A "?" circle only appears where the sheet has a non-empty explainer
   for that key, so the UI stays clean until you fill it in.
   Keys used by this page:
     rate_increase_request, authorized, energy_burden, average_bill,
     capex, iou, docket, commissioner_selection, consumer_advocate
   ------------------------------------------------------------ */
/* Starter explainer copy. The sheet's Glossary tab OVERRIDES this whenever it has
   rows — so populate/refine language there, not here. Kept as a fallback so the "?"
   circles still work offline and before the tab exists. */
const GLOSSARY_FALLBACK = {
  rate_increase_request:{term:'Rate increase request',text:'A formal request a utility files with its state commission to charge customers more. The commission reviews it and can approve, reduce, or reject the amount.'},
  authorized:{term:'Authorized',text:'The portion of a requested increase the commission actually approved. It is often well below what the utility asked for.'},
  energy_burden:{term:'Energy burden',text:"The share of a household's income that goes to energy bills. Shown here for households earning up to the area median income."},
  average_bill:{term:'Average household bill',text:'The typical monthly bill for a household served by a rate-regulated investor-owned utility, averaged across the state.'},
  capex:{term:'Capital expenditures',text:'Money utilities plan to spend building or upgrading infrastructure. Approved spending is recovered from customers through rates, plus an authorized rate of return.'},
  iou:{term:'Investor-owned utility',text:'A private, for-profit utility owned by shareholders. Its rates must be reviewed and approved by the state commission.'},
  docket:{term:'Docket',text:'A proceeding opened at the commission for a specific case — a rate request, a merger, or a policy review. Dockets are public and usually accept public comment.'},
  commissioner_selection:{term:'Selection',text:"How a state's utility commissioners get their seats — appointed by the governor or legislature, or elected by voters."},
  consumer_advocate:{term:'Statutory consumer advocate office',text:'A state office that represents utility customers in commission proceedings, independent of the commission itself.'}
};


/* National-view CapEx headline — the big number in the "Regulated Investor-Owned
   Utilities & Proposed CapEx" box when no state is selected. Pulled live from cell
   B12 ("National CapEx") of the Benchmarks tab. This constant is only the fallback
   shown if that cell is empty or the sheet can't be reached. */
const NATIONAL_CAPEX_HEADLINE = '$1.4T by 2030';
</script>
<style>
  :root{ --yellow:#FFD00F; --orange:#F89735; --orange-deep:#F89735; --magenta:#D91D4C;
    --ink:#1E1B19; --panel:#2c2825; --gray:#999999; --lgray:#F8F3F0;
    --line:#e7e0d9; --muted:#6f6a64; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#fff;font-family:'Cairo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:var(--magenta);text-decoration:none} a:hover{color:var(--orange-deep)}
  .wrap{max-width:1200px;margin:0 auto}
  h1,h2,h3,h4{font-family:'Figtree',sans-serif;margin:0}

  /* header */
  header{background:var(--ink);color:#fff}
  .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:22px 26px;flex-wrap:wrap}
  .hd-left{display:flex;flex-direction:column;gap:12px;min-width:220px}
  .hd-logo{height:36px;width:auto;flex:none;align-self:center}
  .wm{font:900 18px 'Figtree';letter-spacing:.14em}
  .wm .lines{color:var(--orange)}
  .hd h1{font:900 clamp(20px,3.2vw,30px)/1.02 'Figtree';flex:1 1 auto;min-width:200px}
  .picker-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
  .picker{display:flex;gap:8px;align-items:center}
  select.state{font:600 14px 'Figtree';padding:10px 13px;border:none;border-radius:9px;background:#3a352f;color:#fff;min-width:190px;cursor:pointer}
  .clearbtn{font:700 12px 'Figtree';padding:10px 12px;border:1px solid #4a453f;border-radius:9px;background:transparent;color:#fff;cursor:pointer;display:none}
  .clearbtn.show{display:inline-block}

  /* map section */
  .mapsec{background:var(--lgray);border-bottom:1px solid var(--line)}
  .mapinner{padding:22px 26px 8px}
  .maptop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .maptop h2{font:800 clamp(19px,2.6vw,26px)/1 'Figtree'}
  .yr-row{display:flex;flex-wrap:wrap;gap:6px}

  .tt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:600 12px 'Figtree';padding:6px 9px;border-radius:7px;opacity:0;transform:translate(-50%,-120%);white-space:nowrap;z-index:5;transition:opacity .08s}

  .btn{display:inline-flex;align-items:center;gap:7px;font:800 12.5px 'Figtree';padding:11px 16px;border-radius:9px;background:var(--magenta);color:#fff;border:none;cursor:pointer;align-self:flex-start;margin-top:auto}

  .ctt{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font:600 11.5px 'Figtree';padding:6px 9px;border-radius:7px;opacity:0;transform:translate(-50%,-125%);white-space:nowrap;z-index:6;transition:opacity .08s;line-height:1.35}

  .chart-legend i{display:inline-block;width:11px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

  .statrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:6px}
  .statrow .burden{text-align:right}
  .statrow .burden .stat-cap{white-space:nowrap}
  .fnote{margin-top:auto;padding-top:12px;font:500 11.5px/1.4 'Cairo';color:var(--muted)}
  .explain{font:500 14px/1.55 'Cairo';color:#302c28;background:var(--lgray);border-left:3px solid var(--orange);padding:13px 15px;border-radius:0 9px 9px 0;margin-top:2px}

  /* footer */
  footer .gradbar{height:8px;background:linear-gradient(90deg,var(--yellow),var(--orange),var(--magenta))}
  .foot{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 26px;flex-wrap:wrap}
  .foot-logo{height:30px;width:auto;display:block}
  .foot .thanks{flex:1;text-align:center;font:500 12.5px/1.4 'Cairo';color:var(--muted);min-width:200px}
  .foot .thanks b{font-family:'Figtree';font-weight:700;color:var(--ink)}
  a.contact{font:800 12.5px 'Figtree';padding:10px 16px;border-radius:9px;border:1.5px solid var(--magenta);color:var(--magenta);white-space:nowrap;transition:.12s}
  a.contact:hover{background:var(--magenta);color:#fff}
  @media(max-width:640px){.foot{justify-content:center}.foot .thanks{order:3;flex-basis:100%}}

  @media(max-width:820px){ .grid{grid-template-columns:1fr} }
  @media(max-width:640px){
    .grid{padding:8px 16px 24px}
    .hd,.mapinner,.scope{padding-left:16px;padding-right:16px}
    .hd-left{flex:1 1 100%}
    .hd-logo{order:-1;height:30px;align-self:flex-start}
    .picker{flex:1 1 100%}
    select.state{flex:1}
  }
  @media(max-width:480px){
    .hd h1{font-size:20px}

    .box{padding:16px 15px}
    .legend .lab{font-size:10px}

  .loading{padding:70px 26px;text-align:center;font:600 15px 'Figtree';color:var(--muted)}

  /* "?" explainers */

  .hint:focus-visible{outline:2px solid var(--magenta);outline-offset:2px}
  .hintpop{position:fixed;z-index:60;background:var(--ink);color:#fff;border-radius:11px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.24);opacity:0;visibility:hidden;transition:opacity .12s}
  .hintpop.show{opacity:1;visibility:visible}
  .hintpop .t{font:800 11px 'Figtree';letter-spacing:.06em;text-transform:uppercase;color:var(--yellow);margin-bottom:5px}
  .hintpop .b{font:400 13px/1.5 'Cairo';color:#fff}
</style>

<div class="wrap">

    <div class="hd">
      <div class="hd-left">

          <select class="state" id="stateSel"><option value="">National — all states</option></select>
          <button class="clearbtn" id="clearBtn">National view</button>
        </div>

    </div>
  </header>

  <section class="mapsec">

        <h2>Utility Rate Increase <span style="white-space:nowrap">Requests<span id="hintMap"></span></span></h2>

      </div>

<script>
/* ---------- helpers ---------- */
const YEARS=[{k:'total',label:'Total 2021–26'},{k:2021,label:'2021'},{k:2022,label:'2022'},{k:2023,label:'2023'},{k:2024,label:'2024'},{k:2025,label:'2025'},{k:2026,label:'2026'}];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtB=m=>{ m=+m||0; return m>=1000?'$'+(m/1000).toFixed(1)+'B':(m>0?'$'+Math.round(m)+'M':'$0'); };
const fmtBonly=m=>'$'+((+m||0)/1000).toFixed(1)+'B';
const fmtMoney=v=>'$'+(+v).toFixed(2);

/* ---------- "?" explainers (copy comes from the Glossary tab) ---------- */
function glossaryTable(){
  const g=(D&&D.glossary)||null;
  return (g&&Object.keys(g).length)?g:GLOSSARY_FALLBACK;
}
function hint(key){
  const e=glossaryTable()[key]||null;
  if(!e)return '';
  return '<button type="button" class="hint" data-hint="'+esc(key)+'" aria-label="What does &quot;'+esc(e.term)+'&quot; mean?">?</button>';
}
/* Appends the "?" to the LAST WORD inside a nowrap span, so the circle can never
   wrap onto a line by itself in a narrow column. */
function withHint(text,key){
  const h=hint(key);
  if(!h)return esc(text);
  const i=text.lastIndexOf(' ');
  return (i<0?'':esc(text.slice(0,i+1)))+'<span style="white-space:nowrap">'+esc(text.slice(i+1))+h+'</span>';
}
(function(){
  let pop=null;
  function close(){ if(pop)pop.classList.remove('show'); document.querySelectorAll('.hint.on').forEach(b=>b.classList.remove('on')); }
  document.addEventListener('click',e=>{
    const btn=e.target.closest('.hint');
    if(!btn){ if(!e.target.closest('.hintpop')) close(); return; }
    e.preventDefault();
    const entry=glossaryTable()[btn.dataset.hint]||null;
    if(!entry)return;
    if(btn.classList.contains('on')){ close(); return; }
    close(); btn.classList.add('on');
    if(!pop){ pop=document.createElement('div'); pop.className='hintpop'; pop.setAttribute('role','tooltip'); document.body.appendChild(pop); }
    pop.innerHTML='<div class="t">'+esc(entry.term)+'</div><div class="b">'+esc(entry.text)+'</div>';
    pop.classList.add('show');
    const r=btn.getBoundingClientRect(), w=Math.min(320,window.innerWidth-24);
    pop.style.width=w+'px';
    pop.style.left=Math.max(12,Math.min(r.left+r.width/2-w/2,window.innerWidth-w-12))+'px';
    const h=pop.offsetHeight, above=r.top-h-10;
    pop.style.top=(above>8?above:r.bottom+10)+'px';
  });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape')close(); });
  window.addEventListener('resize',close);
  window.addEventListener('scroll',close,true);
})();

/* ---------- CSV + live-sheet loader ---------- */
function colLetter(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(c==='\r'){} else cur+=c; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function gridFromCSV(text){ return parseCSV(text).map((cells,i)=>{const o={_r:i+1};cells.forEach((v,ci)=>o[colLetter(ci+1)]=v);return o;}); }
async function fetchTab(id,name){
  const url='https://docs.google.com/spreadsheets/d/'+id+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(name);
  const r=await fetch(url); if(!r.ok) throw new Error(name+' '+r.status); return gridFromCSV(await r.text());
}
const N=v=>{if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/[$,%\s]/g,''));return isNaN(n)?null:n;};
const S=v=>v==null?'':String(v).trim();
function parseMonth(v){
  const n=N(v);
  if(n!=null&&n>20000){const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000);return{y:d.getUTCFullYear(),m:d.getUTCMonth()+1};}
  const d=new Date(v); if(!isNaN(d))return{y:d.getFullYear(),m:d.getMonth()+1};
  return null;
}
function transform(g){
  const body=(name,hdr)=>g[name].filter(r=>r._r>hdr);
  const D={years:[2021,2022,2023,2024,2025,2026]};
  D.states=body('States',1).map(r=>({name:S(r.A),code:S(r.B)})).filter(s=>s.code);
  D.rateReq={};const rc=['C','D','E','F','G','H'],ac=['J','K','L','M','N','O'];
  for(const r of body('rates',2)){const c=S(r.B);if(!c)continue;const req={},au={};let rt=0,at=0;
    D.years.forEach((y,i)=>{const rv=N(r[rc[i]])||0,av=N(r[ac[i]])||0;req[y]=rv;au[y]=av;rt+=rv;at+=av;});
    D.rateReq[c]={req,auth:au,reqTotal:N(r.I)!=null?N(r.I):rt,authTotal:N(r.P)!=null?N(r.P):at,note:S(r.Q)};}
  D.puc={};for(const r of body('puc',1)){const c=S(r.B);if(!c)continue;D.puc[c]={commission:S(r.C),selection:S(r.D),advocateOffice:S(r.E),advocateName:S(r.F),execDir:S(r.G),ious:S(r.H),docketSearch:S(r.I),website:S(r.J),contactEmail:S(r.K)};}
  D.commissioners={};for(const r of body('commissioners',1)){const c=S(r.B);if(!c)continue;(D.commissioners[c]=D.commissioners[c]||[]).push({name:S(r.C),title:S(r.D)});}
  D.capex={};for(const r of body('capex',1)){const c=S(r.B);if(!c)continue;(D.capex[c]=D.capex[c]||[]).push({utility:S(r.C),capexB:N(r.D),period:S(r.E),multi:S(r.F)==='YES'});}
  // Monthly residential-bill series = column O through the last column with a value
  // (chronological). Columns to the left of O — annual averages (E–K), % change (L),
  // rank (M) and the latest-month snapshot (N) — are metadata, not part of the series.
  const ubHdr=g.bills.find(r=>r._r===2)||{};
  const colIdx=k=>{let n=0;for(let i=0;i<k.length;i++)n=n*26+(k.charCodeAt(i)-64);return n;};
  const mc=Object.keys(ubHdr).filter(k=>k!=='_r'&&colIdx(k)>=15&&parseMonth(ubHdr[k])).sort((a,b)=>colIdx(a)-colIdx(b));
  D.bills={};for(const r of body('bills',2)){const c=S(r.B);if(!c)continue;
    const series=mc.map(k=>{const ym=parseMonth(ubHdr[k]);const v=N(r[k]);return v==null?null:{y:ym.y,m:ym.m,v};}).filter(Boolean);
    D.bills[c]={burden:N(r.C),burdenLowInc:N(r.D),avg2020:N(r.E),avg2026:N(r.K),pctChange:N(r.L),rank:N(r.M),series};}
  // Dockets: header is row 1 (data starts row 2). Column P = "Display Priority",
  // which drives display order; row keeps the sheet's own order as the tiebreaker.
  D.dockets=[];for(const r of body('dockets',1)){const c=S(r.B);if(!c)continue;const dd=parseMonth(r.I);
    D.dockets.push({code:c,type:S(r.C),utility:S(r.D),id:S(r.E),title:S(r.F),status:S(r.G),decision:dd?dd.y+'-'+String(dd.m).padStart(2,'0'):'',reqAmt:N(r.J),roe:N(r.K),incr:N(r.L),mw:N(r.M),horizon:S(r.N),link:S(r.O),priority:N(r.P),row:r._r});}
  D.capexTotals={};if(g.capexTotals){for(const r of body('capexTotals',1)){const c=S(r.B);if(!c)continue;const nums=[N(r.C),N(r.D),N(r.E)].filter(v=>v!=null);let yr=null,tot=null;nums.forEach(v=>{if(Number.isInteger(v)&&v>=2020&&v<=2100)yr=v;else if(tot==null)tot=v;});if(tot==null){const only=nums.find(v=>!(Number.isInteger(v)&&v>=2020&&v<=2100));if(only!=null)tot=only;}D.capexTotals[c]={total:tot,endYear:yr};}}
  // National-view CapEx headline: cell B12 of the Benchmarks tab (label "National CapEx" in col A).
  D.nationalCapex='';
  if(g.benchmarks){
    const r12=g.benchmarks.find(r=>r._r===12); let v=r12?S(r12.B):'';
    if(!v){const lr=g.benchmarks.find(r=>/^national capex$/i.test(S(r.A)));if(lr)v=S(lr.B);}
    D.nationalCapex=v;
  }
  D.glossary=glossaryFrom(g.glossary);
  return D;
}
function glossaryFrom(rows){
  const out={};
  if(!rows)return out;
  for(const r of rows.filter(r=>r._r>1)){
    const key=S(r.A).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    const text=S(r.C);
    if(!key||!text)continue;
    out[key]={term:S(r.B)||S(r.A),text};
  }
  return out;
}
async function loadData(){
  if(CONFIG.sheetId){
    try{ const g={};
      /* All tabs fetched in parallel — one round-trip's latency instead of nine.
         An OPTIONAL tab that fails resolves to null; a required one rejects and
         drops us into the baked-snapshot fallback below. */
      const keys=Object.keys(CONFIG.tabs);
      const grids=await Promise.all(keys.map(k=>
        fetchTab(CONFIG.sheetId,CONFIG.tabs[k]).catch(e=>{ if(OPTIONAL[k])return null; throw e; })));
      keys.forEach((k,i)=>{g[k]=grids[i];});
      const D=transform(g);
      // Resilience: if the live feed returns no monthly bill data (e.g. the Utility Bills tab
      // comes back empty or changed), keep the baked snapshot's bills so the chart and the
      // latest-bill figure still render instead of showing "No bill data available".
      if(window.PUC_DATA&&window.PUC_DATA.bills&&!Object.values(D.bills||{}).some(b=>b&&b.series&&b.series.length)) D.bills=window.PUC_DATA.bills;
      return D;
    }catch(e){ console.warn('Live sheet load failed; using baked snapshot.',e); }
  }
  return window.PUC_DATA;
}

  const MAX=5;

/* ---------- national aggregates ---------- */
function nationalBillSeries(){
  const map={};
  for(const c in D.bills){(D.bills[c].series||[]).forEach(p=>{const k=p.y+'-'+p.m;(map[k]=map[k]||{y:p.y,m:p.m,sum:0,n:0});map[k].sum+=p.v;map[k].n++;});}
  return Object.values(map).sort((a,b)=>a.y-b.y||a.m-b.m).map(o=>({y:o.y,m:o.m,v:o.sum/o.n}));
}
function nationalRate(){
  const req={},auth={};D.years.forEach(y=>{req[y]=0;auth[y]=0;});
  for(const c in D.rateReq){D.years.forEach(y=>{req[y]+=D.rateReq[c].req[y]||0;auth[y]+=D.rateReq[c].auth[y]||0;});}
  return {req,auth};
}

function drawBills(series, id){

  const x=d3.scaleTime().domain(d3.extent(series,d=>new Date(d.y,d.m-1))).range([m.l,W-m.r]);
  const ymin=d3.min(series,d=>d.v),ymax=d3.max(series,d=>d.v),pad=(ymax-ymin)*0.15||10;
  const y=d3.scaleLinear().domain([ymin-pad,ymax+pad]).range([H-m.b,m.t]);
  // year gridlines/ticks
  const yr0=series[0].y+1,yr1=series[series.length-1].y;
  for(let yy=yr0;yy<=yr1;yy++){const xx=x(new Date(yy,0));
    svg.append('line').attr('x1',xx).attr('x2',xx).attr('y1',m.t).attr('y2',H-m.b).attr('stroke','#f0eae4');

  const area=d3.area().x(d=>x(new Date(d.y,d.m-1))).y0(H-m.b).y1(d=>y(d.v)).curve(d3.curveMonotoneX);
  const line=d3.line().x(d=>x(new Date(d.y,d.m-1))).y(d=>y(d.v)).curve(d3.curveMonotoneX);
  svg.append('path').datum(series).attr('d',area).attr('fill','#F897352e');
  svg.append('path').datum(series).attr('d',line).attr('fill','none').attr('stroke','#F89735').attr('stroke-width',2.5);
  const last=series[series.length-1];
  svg.append('circle').attr('cx',x(new Date(last.y,last.m-1))).attr('cy',y(last.v)).attr('r',3.2).attr('fill','#F89735').attr('stroke','#1E1B19').attr('stroke-width',1);
  const tt=document.createElement('div');tt.className='ctt';host.appendChild(tt);
  const focus=svg.append('g').style('display','none');
  focus.append('line').attr('y1',m.t).attr('y2',H-m.b).attr('stroke','#1E1B19').attr('stroke-width',1).attr('stroke-dasharray','3 3').attr('opacity',.5);
  const dot=focus.append('circle').attr('r',4.5).attr('fill','#F89735').attr('stroke','#1E1B19').attr('stroke-width',1.5);
  const bisect=d3.bisector(d=>new Date(d.y,d.m-1)).center;
  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.r-m.l).attr('height',H-m.b-m.t).attr('fill','transparent').style('cursor','crosshair')
    .on('mouseenter',()=>{focus.style('display',null);tt.style.opacity=1;})
    .on('mouseleave',()=>{focus.style('display','none');tt.style.opacity=0;})
    .on('mousemove',(e)=>{const[mx]=d3.pointer(e);const d=series[bisect(series,x.invert(mx))];if(!d)return;const px=x(new Date(d.y,d.m-1)),py=y(d.v);
      focus.select('line').attr('x1',px).attr('x2',px);dot.attr('cx',px).attr('cy',py);
      const r=host.getBoundingClientRect();tt.style.left=(e.clientX-r.left)+'px';tt.style.top=(e.clientY-r.top)+'px';
      tt.innerHTML='<b>'+MONTHS[d.m-1]+' '+d.y+'</b><br><span class="k">Avg. bill</span> '+fmtMoney(d.v);});
}
function drawRate(rr, id){
  const host=document.getElementById(id);if(!host)return;host.innerHTML='';
  if(!rr){host.innerHTML='<div class="miss">No data.</div>';return;}
  const W=760,H=220,m={t:14,r:14,b:24,l:50};
  const svg=d3.select(host).append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const yrs=D.years;
  const x0=d3.scaleBand().domain(yrs).range([m.l,W-m.r]).paddingInner(0.28).paddingOuter(0.12);
  const x1=d3.scaleBand().domain(['req','auth']).range([0,x0.bandwidth()]).padding(0.18);
  const maxv=d3.max(yrs,y=>Math.max(rr.req[y]||0,rr.auth[y]||0))||1;
  const y=d3.scaleLinear().domain([0,maxv*1.1]).range([H-m.b,m.t]);
  [0,maxv/2,maxv].forEach(v=>{svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(v)).attr('y2',y(v)).attr('stroke','#f0eae4');
    svg.append('text').attr('x',m.l-5).attr('y',y(v)+3).attr('text-anchor','end').attr('font-family','Figtree').attr('font-size',12).attr('fill','#6f6a64').text(fmtB(v));});
  yrs.forEach(yy=>svg.append('text').attr('x',x0(yy)+x0.bandwidth()/2).attr('y',H-6).attr('text-anchor','middle').attr('font-family','Figtree').attr('font-size',12).attr('fill','#6f6a64').text(yy));
  const colors={req:'#F89735',auth:'#1E1B19'};
  const tt=document.createElement('div');tt.className='ctt';host.appendChild(tt);
  yrs.forEach(yy=>{['req','auth'].forEach(key=>{const v=rr[key][yy]||0;
    svg.append('rect').attr('x',x0(yy)+x1(key)).attr('y',y(v)).attr('width',x1.bandwidth()).attr('height',Math.max(0,y(0)-y(v))).attr('fill',colors[key]).attr('rx',1.5).style('cursor','pointer')
      .on('mouseenter',function(){d3.select(this).attr('opacity',.8);tt.style.opacity=1;})
      .on('mouseleave',function(){d3.select(this).attr('opacity',1);tt.style.opacity=0;})
      .on('mousemove',function(e){const r=host.getBoundingClientRect();tt.style.left=(e.clientX-r.left)+'px';tt.style.top=(e.clientY-r.top)+'px';
        tt.innerHTML='<b>'+yy+'</b><br><span class="k">'+(key==='req'?'Requested':'Authorized')+'</span> '+fmtB(v);});
  });});
}
</script>
<script>
/* Embed auto-resize: when this page is inside an iframe (e.g. the WordPress embed),
   report its real height to the parent so the iframe can grow/shrink to fit — fixing
   content being cut off on mobile or when a state changes the page height. */
(function(){
  if(window.parent===window) return;               // not embedded — do nothing
  var last=0;
  function post(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h && Math.abs(h-last)>2){ last=h; window.parent.postMessage({pucDashboardHeight:h},'*'); }
  }
  window.addEventListener('load',post);
  window.addEventListener('resize',post);
  if(window.ResizeObserver){ try{ new ResizeObserver(post).observe(document.body); }catch(e){} }
  // a few nudges to catch async chart/font layout after first paint
  [200,600,1200,2500].forEach(function(t){ setTimeout(post,t); });
})();
</script>
